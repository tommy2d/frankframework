# Initialize the framework tables in the local H2 database.
jdbc.migrator.active=true
application.security.http.authentication=true
servlet.ApiListenerServlet.authenticator=GROUPED
api.auth.token-ttl=300

# Each group protects /api/<group>/* on the same API servlet.
servlet.ApiListenerServlet.authenticationGroups=basic,secret,yaml,ad,bearer-api,oidc,sealed,container,psk,public,bearer,header-jwt,header,cookie,issue
servlet.ApiListenerServlet.group.public.authenticator=NONE
servlet.ApiListenerServlet.group.bearer.authenticator=NONE
servlet.ApiListenerServlet.group.header-jwt.authenticator=NONE
servlet.ApiListenerServlet.group.header.authenticator=NONE
servlet.ApiListenerServlet.group.cookie.authenticator=NONE
servlet.ApiListenerServlet.group.issue.authenticator=NONE
application.security.http.authenticators=basic,yaml,ad,bearer-api,oidc,sealed,psk

servlet.ApiListenerServlet.group.secret.authenticator=basic
servlet.ApiListenerServlet.group.secret.securityRoles=HelloReader
servlet.ApiListenerServlet.group.basic.authenticator=basic
servlet.ApiListenerServlet.group.basic.securityRoles=HelloReader
application.security.http.authenticators.basic.type=IN_MEMORY
application.security.http.authenticators.basic.authAlias=hello

servlet.ApiListenerServlet.group.yaml.authenticator=yaml
servlet.ApiListenerServlet.group.yaml.securityRoles=HelloReader
application.security.http.authenticators.yaml.type=YAML
application.security.http.authenticators.yaml.file=localUsers.yml

servlet.ApiListenerServlet.group.ad.authenticator=ad
servlet.ApiListenerServlet.group.ad.securityRoles=HelloReader
application.security.http.authenticators.ad.type=AD
application.security.http.authenticators.ad.domainName=${ad.domain}
application.security.http.authenticators.ad.url=${ad.url}
application.security.http.authenticators.ad.baseDn=${ad.base}
application.security.http.authenticators.ad.roleMappingFile=ldap-role-mapping.properties

servlet.ApiListenerServlet.group.bearer-api.authenticator=bearer-api
servlet.ApiListenerServlet.group.bearer-api.securityRoles=HelloReader
application.security.http.authenticators.bearer-api.type=BEARER_ONLY
application.security.http.authenticators.bearer-api.issuerUri=${auth.issuer}
application.security.http.authenticators.bearer-api.audience=${auth.audience}
application.security.http.authenticators.bearer-api.authoritiesClaimName=realm_access.roles
application.security.http.authenticators.bearer-api.jwkSetUri=${auth.jwks}

servlet.ApiListenerServlet.group.oidc.authenticator=oidc
servlet.ApiListenerServlet.group.oidc.securityRoles=HelloReader
application.security.http.authenticators.oidc.type=OAUTH2
application.security.http.authenticators.oidc.provider=custom
application.security.http.authenticators.oidc.clientAuthAlias=oidc
application.security.http.authenticators.oidc.scopes=openid,profile
application.security.http.authenticators.oidc.issuerUri=${auth.issuer}
application.security.http.authenticators.oidc.authorizationUri=${auth.authorization}
application.security.http.authenticators.oidc.tokenUri=${auth.token}
application.security.http.authenticators.oidc.jwkSetUri=${auth.jwks}
application.security.http.authenticators.oidc.userInfoUri=${auth.userinfo}
application.security.http.authenticators.oidc.userNameAttributeName=preferred_username
application.security.http.authenticators.oidc.authoritiesClaimName=realm_access.roles
application.security.http.authenticators.oidc.audience=${auth.audience}
application.security.http.authenticators.oidc.roleMappingFile=oauth-role-mapping.properties
application.security.http.authenticators.oidc.allowBearerAuthentication=true
application.security.http.authenticators.oidc.usePkce=true

servlet.ApiListenerServlet.group.sealed.authenticator=sealed
servlet.ApiListenerServlet.group.sealed.securityRoles=ClosedRoute
application.security.http.authenticators.sealed.type=SEALED

servlet.ApiListenerServlet.group.container.authenticator=CONTAINER
servlet.ApiListenerServlet.group.container.securityRoles=HelloReader

servlet.ApiListenerServlet.group.psk.authenticator=psk
servlet.ApiListenerServlet.group.psk.securityRoles=HelloReader
application.security.http.authenticators.psk.type=IN_MEMORY
application.security.http.authenticators.psk.authAlias=partner
application.security.http.authenticators.psk.apiKeyHeader=X-Customer-Key
