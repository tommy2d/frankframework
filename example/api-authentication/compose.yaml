name: frank-auth-reference

services:
  frankframework:
    image: hello-world-frankframework:local
    pull_policy: never
    ports: ["127.0.0.1:${FRANK_HTTP_PORT:-8180}:8080"]
    environment:
      instance.name: authreference
      application.security.console.authentication.type: IN_MEMORY
      application.security.console.authentication.username: admin
      application.security.console.authentication.password: frank-local
      configurations.directory.autoLoad: "true"
      auth.issuer: "${OIDC_ISSUER:-https://idp.invalid/realms/hello}"
      auth.audience: "${OIDC_AUDIENCE:-hello-api}"
      auth.jwks: "${OIDC_JWKS_URI:-https://idp.invalid/realms/hello/protocol/openid-connect/certs}"
      auth.authorization: "${OIDC_AUTHORIZATION_URI:-https://idp.invalid/realms/hello/protocol/openid-connect/auth}"
      auth.token: "${OIDC_TOKEN_URI:-https://idp.invalid/realms/hello/protocol/openid-connect/token}"
      auth.userinfo: "${OIDC_USERINFO_URI:-https://idp.invalid/realms/hello/protocol/openid-connect/userinfo}"
      ad.domain: "${AD_DOMAIN:-example.org}"
      ad.base: "${AD_BASE_DN:-DC=example,DC=org}"
      ad.url: "${AD_URL:-ldaps://ad.invalid:636}"
      ad.readerGroup: "${AD_READER_GROUP:-CN=HelloReaders,OU=Groups,DC=example,DC=org}"
    volumes:
      - ./configurations:/opt/frank/configurations:ro
      - ./resources.yml:/opt/frank/resources/resources.yml:ro
      - ./DeploymentSpecifics.properties:/opt/frank/resources/DeploymentSpecifics.properties:ro
      - ./ldap-role-mapping.properties:/opt/frank/resources/ldap-role-mapping.properties:ro
      - ./oauth-role-mapping.properties:/opt/frank/resources/oauth-role-mapping.properties:ro
      - ./ROOT.xml:/usr/local/tomcat/conf/Catalina/localhost/ROOT.xml:ro
      - ./web.xml:/usr/local/tomcat/webapps/ROOT/WEB-INF/web.xml:ro
      - ./private/tomcat-users.xml:/run/secrets/tomcat-users.xml:ro
      - ./private/localUsers.yml:/opt/frank/resources/localUsers.yml:ro
      - ./private/runtime.properties:/opt/frank/secrets/credentials.properties:ro
